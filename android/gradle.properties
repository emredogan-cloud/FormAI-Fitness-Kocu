# ─── Phase 117 · build performance stabilization ────────────────────────────
#
# Previous setting: `org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G ...`
#
# Problem: the configured JVM commit potential (8 GB heap + 4 GB metaspace +
# 512 MB code cache + JIT/native overhead) was ~13 GB. On the dev machine
# (15 GB total RAM) once Android Studio (~1.7 GB idle) and system services
# (~1 GB) are accounted for, the working set overshoots physical memory
# and forces the kernel to swap. Measurements showed ~4.9 GB swap usage
# during builds — every page-fault costs ~10 ms, and a long Gradle build
# touches millions of pages. This added an estimated 30-50 % to
# `flutter run` cycle time on this hardware.
#
# Empirically, Flutter + AGP 8.x debug builds for projects this size
# settle at 1.5-2.5 GB JVM heap usage. 4 GB ceiling gives generous
# headroom without overshooting RAM. Bump only if a release build
# (`flutter build apk --release`) hits a real OutOfMemoryError — debug
# builds will not.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Phase 117 · explicit daemon / parallel / caching flags. Default-on in
# Gradle 8.x but explicit declaration makes the build contract legible
# and survives default changes across Gradle versions.
#   • daemon: keep the JVM warm between builds — avoids the 5-15 s
#     JVM spin-up that hits every cold `flutter run`.
#   • parallel: build independent project modules concurrently. Safe
#     here because every native plugin we use is independent.
#   • caching: hash-keyed task outputs. The first incremental build
#     pays the cost; every subsequent one trims minutes off Gradle's
#     `:app:processDebugResources` and similar.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
