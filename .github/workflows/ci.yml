name: CI

# Phase 44 · Continuous integration gate — the ONE workflow of record.
#
# Consolidation (roadmap 6.1): the older `flutter_ci.yml` duplicated the
# format/analyze loop with drifting triggers and carried the debug-APK
# build; both now live here and that file is gone. Branch triggers cover
# the working branches the old workflow watched.
on:
  workflow_dispatch: # manual full run (incl. the emulator job)
  push:
    branches:
      - main
      - staging
      - 'feature/*'
      - 'prisk/*'
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Format, analyze, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `.env` is expected at runtime by `flutter_dotenv`. CI has no
      # secrets available so a blank file keeps the analyzer happy
      # without shipping real values.
      - name: Create empty .env for analyzer / test startup
        run: touch .env

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Guard .env template for ship-forbidden secrets
        run: bash tool/check_env_no_secrets.sh .env.example

      - name: Analyze source
        run: flutter analyze

      # Roadmap Phase 5 (C11) · hardcoded-string ratchet.
      #
      # Fails only when a gated presentation file gains user-facing
      # Turkish literals versus the committed baseline. Extraction
      # lowers the baseline; nothing can raise it. A gate that failed on
      # all ~1,100 pre-existing literals from day one would have been
      # disabled in week one.
      - name: Guard against new hardcoded user-facing strings
        run: dart run tool/check_hardcoded_strings.dart

      # Missing keys, unused keys, placeholder mismatches, and English
      # values that are still Turkish.
      #
      # `--strict` from Phase 6 on. While the app shipped one language a
      # gap was a note to self; now that English is a declared locale, a
      # translation that drops {count} renders a sentence with a hole to
      # a real user, so it blocks the build. The report is unchanged —
      # only its exit code is.
      - name: ARB coverage
        run: dart run tool/arb_coverage.dart --strict

      # Roadmap Phase 7 (§6.3) · the CONTENT translation gate.
      #
      # The ARB gates above check the UI. This one checks the catalogue,
      # which they cannot see: recipe titles, method steps and ingredient
      # names live in Postgres and change without an app release.
      #
      # It reads through the public REST endpoint with the anon key, the
      # same way the app does, so CI needs no database password. CI also
      # writes a blank `.env`, so on this runner the tool prints a SKIP
      # and exits 0 — it is a local and pre-release gate, and the
      # committed baseline is what stops coverage silently falling.
      - name: Recipe translation audit
        run: dart run tool/recipe_translation_audit.dart

      # The pseudo-localisation wrapper is generated from the generated
      # localisations class. If it goes stale, a new ARB key renders
      # un-inflated and the pseudo-locale layout sweep silently stops
      # testing it — a green suite that checks less than it claims.
      - name: Pseudo-localisations wrapper is in step
        run: dart run tool/gen_pseudo_localizations.dart --check

      # Roadmap Phase 8 (C13) · direction-neutrality, as a ratchet.
      #
      # The RTL layout sweeps assert that nothing overflows when a screen
      # is rendered right-to-left. An `Alignment.centerLeft` does not
      # overflow — it lays out perfectly, on the wrong side — so the
      # sweeps cannot see it and never will. Only reading the source can,
      # which is what this does.
      #
      # Ratcheting for the same reason the hardcoded-string gate does:
      # 177 pre-existing call sites, most of them decorative overlays
      # where mirroring is a judgement call. Converting a screen lowers
      # the baseline; nothing raises it.
      - name: Guard against new direction-dependent layout
        run: dart run tool/check_directional_layout.dart

      - name: Run unit and widget tests (with coverage)
        run: flutter test --coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build-apk:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gradle + the Android build tree are disk-heavy; reclaim ~10 GB of
      # unused pre-installed toolchains so a tight runner can't run out.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create empty .env for build
        run: touch .env

      - name: Build Android APK (debug)
        run: flutter build apk --debug

  integration:
    name: Integration E2E (Android emulator)
    # Minutes diet: this job costs ~20 runner-minutes and was running on every
    # push, which exhausted the account's Actions quota (billing-blocked runs).
    # It now runs on pull requests + manual dispatch only; the per-push gate
    # stays the fast format/analyze/test + debug-APK jobs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The AVD system image + snapshot are several GB; on a tight runner the
      # emulator job has intermittently hit "No space left on device". Reclaim
      # ~10 GB of pre-installed toolchains this build never touches. Dependency
      # -free (no third-party action) and safe — none of these back a Flutter/
      # Android build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create empty .env for boot
        run: touch .env

      # ubuntu-latest exposes /dev/kvm root-only; without this udev rule
      # the emulator falls back to software rendering and times out — the
      # cause of every prior red run of this job (android-emulator-runner's
      # documented required step for GitHub-hosted runners).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Phase 1 (P-Risk) · runs integration_test/ on a real Android image.
      # KVM-accelerated runner; mirrors the local Pixel/API34 validation.
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: flutter test integration_test/app_test.dart
