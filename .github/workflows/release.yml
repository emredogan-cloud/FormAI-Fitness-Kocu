name: Release

# Phase 3 (P-Risk) F31 · release artifact pipeline, extended by the
# FINAL_STORE_SUBMISSION_ROADMAP Phase 2 (R2/S3/A3):
#
#   • builds are obfuscated (--obfuscate --split-debug-info) and the Dart
#     symbol directory ships as a workflow artifact;
#   • a 16 KB page-size alignment gate runs on every AAB (Play requirement
#     since 2025-11-01 for apps targeting Android 15+);
#   • the release keystore, Sentry symbol upload, and Play internal-track
#     upload are OPTIONAL steps that activate only when their secrets are
#     configured (see EXTERNAL_ACTION_LEDGER.md):
#         ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#         ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
#         SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT
#         PLAY_SERVICE_ACCOUNT_JSON
#     Without them the job still produces (debug-signed) artifacts and
#     warns loudly, exactly as before.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-build:
    name: Build release AAB + APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject client-public .env from CI secrets
        run: |
          cat > .env <<'ENV'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          CDN_BASE_URL=${{ secrets.CDN_BASE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}
          REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}
          ENV

      - name: Guard — no ship-forbidden secret reached .env
        run: bash tool/check_env_no_secrets.sh .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Secrets cannot be referenced in step `if:` conditions directly —
      # detect which optional credentials exist once and gate on outputs.
      - name: Detect optional release credentials
        id: creds
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "keystore=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "play=$([ -n "$PLAY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "sentry=$([ -n "$SENTRY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Materialize release keystore
        if: steps.creds.outputs.keystore == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # REV-E10 · gradle silently falls back to DEBUG signing when
      # android/key.properties is absent (deliberate, so local builds
      # work) — but a debug-signed "release" artifact is not
      # Play-uploadable and is dangerously easy to mis-distribute.
      # Make the state unmissable in the job log + summary.
      - name: Warn if artifacts will be DEBUG-signed
        run: |
          if [ ! -f android/key.properties ]; then
            echo "::warning title=Debug-signed artifacts::android/key.properties is absent — the AAB/APK below are DEBUG-signed and NOT uploadable to Play. Configure the release keystore secrets before distributing."
            echo "⚠️ **Artifacts are DEBUG-signed** (no release keystore configured)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # S3 · obfuscated release builds. The Dart symbol files land in
      # build/symbols and ship as an artifact; Sentry consumes them in
      # the optional step below so crash stacks stay readable.
      - name: Build release App Bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      # A3 · Play rejects new apps/updates targeting Android 15+ whose
      # native libs aren't 16 KB page-aligned (mandatory since
      # 2025-11-01; extensions expired 2026-05-31). Fail the build the
      # moment a dependency regresses.
      - name: Verify 16 KB page-size alignment (arm64)
        run: |
          workdir=$(mktemp -d)
          unzip -o -q build/app/outputs/bundle/release/app-release.aab 'base/lib/arm64-v8a/*' -d "$workdir"
          cd "$workdir"
          python3 - <<'PY'
          import glob, subprocess, sys
          libs = glob.glob('base/lib/arm64-v8a/*.so')
          if not libs:
              print('No arm64 libs found in AAB — unexpected'); sys.exit(1)
          bad = []
          for so in libs:
              out = subprocess.run(['readelf', '-lW', so],
                                   capture_output=True, text=True).stdout
              for line in out.splitlines():
                  parts = line.split()
                  if parts and parts[0] == 'LOAD' and int(parts[-1], 16) < 0x4000:
                      bad.append((so, parts[-1]))
          if bad:
              print('16 KB alignment FAIL:', bad); sys.exit(1)
          print(f'16 KB alignment OK for {len(libs)} arm64 libs')
          PY

      - name: Upload debug symbols to Sentry
        if: steps.creds.outputs.sentry == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: dart run sentry_dart_plugin

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/symbols
          if-no-files-found: error

      # Activates once PLAY_SERVICE_ACCOUNT_JSON + the keystore secrets
      # exist (a debug-signed AAB would be rejected by the API anyway).
      - name: Upload to Play Internal track
        if: steps.creds.outputs.play == 'true' && steps.creds.outputs.keystore == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.emredogan.formaifit
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
