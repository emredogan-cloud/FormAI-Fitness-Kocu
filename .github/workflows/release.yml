name: Release

# Phase 3 (P-Risk) F31 · release artifact pipeline.
#
# On a version tag (or manual dispatch) this injects the CLIENT-PUBLIC `.env`
# from CI secrets (never committed — see Phase 0), runs the secret guard +
# analyze + tests, then builds the release AAB + APK and uploads them as
# workflow artifacts.
#
# DEFERRED — REQUIRES EXTERNAL CREDENTIALS: the actual Play Store upload and
# release SIGNING with the upload keystore need secrets that are intentionally
# NOT in this repo (PLAY_SERVICE_ACCOUNT_JSON, ANDROID_KEYSTORE_*). The upload
# step is wired below as a commented block — enable it once those secrets are
# configured in the repository settings.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-build:
    name: Build release AAB + APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject client-public .env from CI secrets
        run: |
          cat > .env <<'ENV'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          CDN_BASE_URL=${{ secrets.CDN_BASE_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }}
          REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}
          ENV

      - name: Guard — no ship-forbidden secret reached .env
        run: bash tool/check_env_no_secrets.sh .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # REV-E10 · gradle silently falls back to DEBUG signing when
      # android/key.properties is absent (deliberate, so local builds
      # work) — but a debug-signed "release" artifact is not
      # Play-uploadable and is dangerously easy to mis-distribute.
      # Make the state unmissable in the job log + summary.
      - name: Warn if artifacts will be DEBUG-signed
        run: |
          if [ ! -f android/key.properties ]; then
            echo "::warning title=Debug-signed artifacts::android/key.properties is absent — the AAB/APK below are DEBUG-signed and NOT uploadable to Play. Configure the release keystore secrets before distributing."
            echo "⚠️ **Artifacts are DEBUG-signed** (no release keystore configured)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # DEFERRED — REQUIRES EXTERNAL CREDENTIALS. Uncomment once
      # PLAY_SERVICE_ACCOUNT_JSON (+ release signing keystore) are configured:
      #
      # - name: Upload to Play Internal track
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.emredogan.formaifit
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: internal
