name: Secret Scan

# Phase 0 (P-Risk) · prevents any real secret from entering the repo or the
# shipped .env asset. Two independent gates:
#   1. gitleaks — scans tracked files + full git history for credential patterns.
#   2. env-guard — asserts the .env template carries no ship-forbidden secret.
on:
  push:
    branches: [main, staging, 'feature/*', 'prisk/*']
  pull_request:
    branches: [main, staging]

jobs:
  gitleaks:
    name: gitleaks (history + tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the MIT-licensed gitleaks BINARY directly instead of the v2
      # GitHub Action wrapper. The wrapper added a license gate that, for
      # org-associated accounts, fails the job whenever its license-check
      # API call is rate-limited by GitHub — a non-deterministic red that
      # has nothing to do with the code. The binary uses the same detection
      # engine and auto-loads our `.gitleaks.toml`, with no license call.
      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1

  env-guard:
    name: .env secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # CI never holds a real .env; we assert the committed template is clean.
      - name: Guard .env.example
        run: bash tool/check_env_no_secrets.sh .env.example
