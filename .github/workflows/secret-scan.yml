name: Secret Scan

# Phase 0 (P-Risk) · prevents any real secret from entering the repo or the
# shipped .env asset. Two independent gates:
#   1. gitleaks — scans tracked files + full git history for credential patterns.
#   2. env-guard — asserts the .env template carries no ship-forbidden secret.
on:
  push:
    branches: [main, staging, 'feature/*', 'prisk/*']
  pull_request:
    branches: [main, staging]

jobs:
  gitleaks:
    name: gitleaks (history + tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Free for personal/public repos; org runs may set a license secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  env-guard:
    name: .env secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # CI never holds a real .env; we assert the committed template is clean.
      - name: Guard .env.example
        run: bash tool/check_env_no_secrets.sh .env.example
