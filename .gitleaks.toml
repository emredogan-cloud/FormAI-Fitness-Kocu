# Phase 0 (P-Risk) · gitleaks configuration.
# Scans tracked files + full history for committed secrets in CI.
title = "FormAI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow example templates and resolved lockfiles"
paths = [
  '''\.env\.example$''',
  '''pubspec\.lock$''',
  # NOTE: the historical logs.txt allowlist is GONE on purpose. When the repo
  # went public, its pre-811aae5 history (which held real session tokens in a
  # committed adb log) was rewritten with git-filter-repo to purge logs.txt
  # entirely — so the scanner is fully strict again. If logs.txt ever
  # reappears in a commit, it SHOULD fail this scan.
]
# Placeholder values used in templates/docs must not trip the scanner.
regexes = [
  '''your-[a-z-]+-(key|id|dsn)''',
  '''<redacted>''',
  # Documentation example in supabase/functions/revenuecat-webhook/README.md —
  # a literal placeholder in a local curl command, not a credential.
  '''local-test-secret''',
]
