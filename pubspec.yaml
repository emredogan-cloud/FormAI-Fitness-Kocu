name: sixpack_ai
description: "SixPack AI - 30 Günde Karın Kası. AI-powered fitness coaching."
publish_to: 'none'
version: 0.1.0+5

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Backend / Auth
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^17.2.1

  # Environment variables
  flutter_dotenv: ^6.0.0

  # Camera & AI / Computer Vision
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1
  permission_handler: ^12.0.1

  # Text-to-speech voice feedback
  flutter_tts: ^4.0.2

  # Local persistence
  shared_preferences: ^2.2.2

  # Video playback for exercise guides
  video_player: ^2.8.6

  # In-app purchases & subscriptions (RevenueCat)
  purchases_flutter: ^8.1.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  # Network image + disk/memory cache. Phase 40: replaces `Image.network`
  # everywhere so tarif/hero/thumbnail images don't re-download per scroll.
  cached_network_image: ^3.4.1
  # Phase 42 — Observability stack.
  #   • sentry_flutter: crash reporting + breadcrumb trail.
  #   • posthog_flutter: typed analytics events (funnel + churn).
  #   • app_tracking_transparency: iOS 14.5+ ATT prompt wrapper.
  sentry_flutter: ^9.6.0
  posthog_flutter: ^5.3.0
  app_tracking_transparency: ^2.0.6
  wakelock_plus: ^1.6.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  # Phase 49 · skeleton loaders. The shimmer animation drives the
  # `SkeletonBox` / `SkeletonLine` widgets in lib/core/widgets/
  # skeleton_loader.dart, replacing generic CircularProgressIndicators
  # in the recipe grid, the 30-day grid, and the plan-detail exercise
  # list while data is in flight.
  shimmer: ^3.0.0
  # Phase 50B · image picker for the internal admin panel. Chosen
  # over `file_picker` because the alternative had a transitive
  # `win32` version conflict with our `wakelock_plus` pin, and
  # because the admin panel only ever picks images. On web,
  # `XFile.readAsBytes()` returns the raw bytes for the Supabase
  # Storage upload pipeline.
  image_picker: ^1.1.2
  # Phase 51 · explicit dependency on the disk-cache layer that
  # `cached_network_image` already pulled in transitively. Promoting
  # it to a direct dep so `ExerciseGuidePlayer` can hand video URLs
  # to the same cache (cache hit → play from disk; miss → stream +
  # background download to populate the cache for the next set).
  flutter_cache_manager: ^3.4.1
  # Phase 54 · viral-loop stack.
  #   • share_plus: native iOS / Android share-sheet bridge. Used by
  #     `ShareService` to hand the rendered Story PNG (1080x1920) or
  #     Square PNG (1080x1080) over to Instagram / WhatsApp / etc.
  #   • path_provider: temp-directory access so we can drop the PNG
  #     bytes onto disk before the share intent picks them up.
  #   • app_links: universal-link / custom-scheme bridge. Routes
  #     incoming `formai://` URLs (and in the future, https://formai.app
  #     deep links) into the Riverpod-owned GoRouter.
  # share_plus 13.x bumps win32 to ^6.x to align with our wakelock_plus
  # 1.6.0 pin (10.x's win32 ^5.x conflicted on resolve).
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  app_links: ^6.3.2
  # Phase 56 Lite · promoted from transitive (sentry / RevenueCat / etc.)
  # to direct because the in-app feedback service stamps every submission
  # with the running build's version + build number for triage.
  package_info_plus: ^10.0.0
  # Phase 55 · home-screen widget bridge. Pushes (today_task_name,
  # progress_percent, streak_count) into a shared `UserDefaults` group
  # on iOS and `SharedPreferences` on Android, then rings the platform
  # widget-update hook so WidgetKit / AppWidgetProvider rebuilds the
  # home-screen tile. Native Swift / Kotlin sources live under
  # ios/FormAIWidget/ and android/app/src/main/kotlin/.../widget/.
  home_widget: ^0.7.0
  # Phase 55 · iOS Live Activities + Dynamic Island. The Flutter side
  # only owns lifecycle (start / update / end); the SwiftUI presentation
  # for compactLeading / compactTrailing / minimal / expanded ships as
  # a native Widget Extension under ios/FormAILiveActivity/.
  live_activities: ^2.4.1
  change_app_package_name: ^1.5.0
  # Phase 89 · offline detection. Powers `connectivityProvider`
  # (lib/core/services/connectivity_service.dart) which gates the
  # workout-camera entry, the Google/Apple sign-in buttons, and the
  # Supabase catalogue fetch. The plugin reads platform-native
  # connectivity status — fast, doesn't itself make network calls —
  # so the offline detection happens before we even attempt a
  # Supabase round-trip that would otherwise hang for 30 s.
  connectivity_plus: ^6.0.5
  # Phase 103 · `rive: ^0.13.20` was added in Phase 97 for the
  # eventual living-coach state machine, then removed here because:
  #   1. The .riv asset hasn't been delivered by the artist yet — no
  #      Dart code imports `package:rive` anywhere in lib/.
  #   2. Rive's native Android build (rive_common) fails under the
  #      Snap-installed Flutter toolchain (`/snap/flutter/current/
  #      usr/include/c++/9/...` headers conflict with Rive's modern
  #      C++). The blocker is the Snap confinement, not Rive itself.
  # The cinematic onboarding runs entirely on hand-coded primitives
  # (lib/core/motion/) and `LivingCoachAvatar` is structured as an
  # adapter so a Rive-backed implementation can drop in without
  # changing call sites. Re-add `rive` when both:
  #   • the artist delivers an .riv with the 8 facial states, AND
  #   • the dev environment migrates off Snap Flutter (or pins
  #     NDK 25 explicitly + tests Rive 0.14.x against it).
  # See LivingCoachAvatar's docstring for the swap-in protocol.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Phase 44 QA · end-to-end UI testing harness. Runs on-device tests
  # from integration_test/ under `flutter test integration_test/` or
  # `flutter drive`, sharing the same assertions API as flutter_test.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Native app-icon generator. Pinned to ^0.14.x so the config block
  # below (flutter_launcher_icons:) keeps parsing on future upgrades.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    # Bespoke onboarding + prediction artwork (all Turkish-named PNG/JPEG/
    # WEBP files live at the photos/ root). Folder is quoted for safety.
    # Phase 40 removed the `docs/<region>/` jpegs that the Bölgeler strip
    # used pre-Phase-35; the strip now points at Unsplash URLs and the
    # binary weight (~2 MB across 7 folders) was dead bundle space.
    #
    # Phase 127 · ASSET HYGIENE RULE. This `- "photos/"` declaration is
    # non-recursive (Flutter's asset semantics — every subdirectory needs
    # its own line below) but it DOES bundle every file at the root of
    # `photos/` into the APK. Art-direction *reference imagery* (Claude
    # conversation visual targets, design comp screenshots, cinematic
    # mood boards) belongs at `docs/reference-imagery/` — NOT at the
    # root of `photos/`. The Phase 127 audit caught 3 large reference
    # PNGs (4.6 MB combined) that had drifted into `photos/` between
    # Phases 124 and 126 and were silently shipping in every APK; they
    # have since been relocated. Future visual references go to
    # `docs/reference-imagery/`, not here.
    - "photos/"
    # Phase 69 · per-recipe meal cover photos (real VP8 WebP, ~280 KB
    # each). Flutter asset declarations are not recursive, so the
    # subdirectory has to be listed explicitly even though `photos/`
    # is already declared above.
    - "photos/meals/"
    # Phase 70 · per-plan workout dashboard thumbnails (real VP8 WebP,
    # ~95 KB each). Same recursion caveat as photos/meals/ above.
    - "photos/workouts/"

# Launcher icon source. Uses a square PNG (derived from the onboarding
# webp by ImageMagick convert) because flutter_launcher_icons needs PNG
# input. Regenerate native icons whenever this file changes via:
#   flutter pub run flutter_launcher_icons
#
# Phase 120 · moved out of photos/ → tool/. The previous location
# accidentally bundled the 1.35 MB source PNG into every debug APK
# (because pubspec's `flutter:assets:` declares the whole `photos/`
# directory). This icon is read once at icon-generation time and
# never at runtime, so bundling it was pure waste — ~1.4 MB removed
# from every debug install + ~50-200 ms saved per `adb install`.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "tool/app_icon.png"
  remove_alpha_ios: true
