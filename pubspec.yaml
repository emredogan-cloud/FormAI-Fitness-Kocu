name: sixpack_ai
description: "SixPack AI - 30 Günde Karın Kası. AI-powered fitness coaching."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Backend / Auth
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^17.2.1

  # Environment variables
  flutter_dotenv: ^6.0.0

  # Camera & AI / Computer Vision
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1
  permission_handler: ^12.0.1

  # Text-to-speech voice feedback
  flutter_tts: ^4.0.2

  # Local persistence
  shared_preferences: ^2.2.2

  # Video playback for exercise guides
  video_player: ^2.8.6

  # In-app purchases & subscriptions (RevenueCat)
  purchases_flutter: ^8.1.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Native app-icon generator. Pinned to ^0.14.x so the config block
  # below (flutter_launcher_icons:) keeps parsing on future upgrades.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/videos/
    # Reference photography for per-category cards. Folder names contain
    # spaces and Turkish characters so the paths MUST stay quoted below
    # for the YAML parser to round-trip them as-is to the asset manifest.
    - "docs/Core (Karın & Stabilite)/"
    - "docs/Göğüs (Chest)/"
    - "docs/Sırt (Back)/"
    - "docs/Bacak (Legs)/"
    - "docs/Kol (Arms)/"
    - "docs/Omuz (Shoulders)/"
    - "docs/Kardiyo & Full Body/"
    # Bespoke onboarding + prediction artwork (all Turkish-named PNG/JPEG/
    # WEBP files live at the photos/ root). Folder is quoted for safety.
    - "photos/"

# Launcher icon source. Uses a square PNG (derived from the onboarding
# webp by ImageMagick convert) because flutter_launcher_icons needs PNG
# input. Regenerate native icons whenever this file changes via:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "photos/app_icon.png"
  remove_alpha_ios: true
