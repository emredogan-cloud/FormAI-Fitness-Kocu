name: sixpack_ai
description: "SixPack AI - 30 Günde Karın Kası. AI-powered fitness coaching."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Backend / Auth
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^17.2.1

  # Environment variables
  flutter_dotenv: ^6.0.0

  # Camera & AI / Computer Vision
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1
  permission_handler: ^12.0.1

  # Text-to-speech voice feedback
  flutter_tts: ^4.0.2

  # Local persistence
  shared_preferences: ^2.2.2

  # Video playback for exercise guides
  video_player: ^2.8.6

  # In-app purchases & subscriptions (RevenueCat)
  purchases_flutter: ^8.1.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  # Network image + disk/memory cache. Phase 40: replaces `Image.network`
  # everywhere so tarif/hero/thumbnail images don't re-download per scroll.
  cached_network_image: ^3.4.1
  # Phase 42 — Observability stack.
  #   • sentry_flutter: crash reporting + breadcrumb trail.
  #   • posthog_flutter: typed analytics events (funnel + churn).
  #   • app_tracking_transparency: iOS 14.5+ ATT prompt wrapper.
  sentry_flutter: ^9.6.0
  posthog_flutter: ^5.3.0
  app_tracking_transparency: ^2.0.6
  wakelock_plus: ^1.6.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Native app-icon generator. Pinned to ^0.14.x so the config block
  # below (flutter_launcher_icons:) keeps parsing on future upgrades.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    # Bespoke onboarding + prediction artwork (all Turkish-named PNG/JPEG/
    # WEBP files live at the photos/ root). Folder is quoted for safety.
    # Phase 40 removed the `docs/<region>/` jpegs that the Bölgeler strip
    # used pre-Phase-35; the strip now points at Unsplash URLs and the
    # binary weight (~2 MB across 7 folders) was dead bundle space.
    - "photos/"

# Launcher icon source. Uses a square PNG (derived from the onboarding
# webp by ImageMagick convert) because flutter_launcher_icons needs PNG
# input. Regenerate native icons whenever this file changes via:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "photos/app_icon.png"
  remove_alpha_ios: true
